name: Telegram commands

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # every 15 minutes
  workflow_dispatch:
    inputs:
      mode:
        description: "check = test every key, whoami = reply with chat id, send-test = test message, poll = answer commands"
        type: choice
        options: [check, whoami, send-test, poll]
        default: check

permissions:
  contents: read   # reads the database; never writes it

concurrency:
  group: scout-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore database (read-only)
        run: scripts/db_sync.sh pull

      - name: Run
        env:
          MODE: ${{ inputs.mode || 'poll' }}
          # Only the setup check needs the AI and search keys; the 15-minute poller never gets them.
          GEMINI_API_KEY: ${{ inputs.mode == 'check' && secrets.GEMINI_API_KEY || '' }}
          ANTHROPIC_API_KEY: ${{ inputs.mode == 'check' && secrets.ANTHROPIC_API_KEY || '' }}
          TAVILY_API_KEY: ${{ inputs.mode == 'check' && secrets.TAVILY_API_KEY || '' }}
          YOUTUBE_API_KEY: ${{ inputs.mode == 'check' && secrets.YOUTUBE_API_KEY || '' }}
          SCOUT_LLM_PROVIDER: ${{ vars.SCOUT_LLM_PROVIDER }}
          SCOUT_EXTRACT_MODEL: ${{ vars.SCOUT_EXTRACT_MODEL }}
          SCOUT_ANALYSIS_MODEL: ${{ vars.SCOUT_ANALYSIS_MODEL }}
        run: python -m scout "$MODE"
