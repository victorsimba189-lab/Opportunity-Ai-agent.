name: Telegram commands

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # every 15 minutes
  workflow_dispatch:
    inputs:
      mode:
        description: "poll = answer commands, whoami = reply with chat id, send-test = test message"
        type: choice
        options: [poll, whoami, send-test]
        default: poll

permissions:
  contents: read   # reads the database; never writes it

concurrency:
  group: scout-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore database (read-only)
        run: scripts/db_sync.sh pull

      - name: Run
        env:
          MODE: ${{ inputs.mode || 'poll' }}
        run: python -m scout "$MODE"
